[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engram-memory"
version = "0.1.0"
description = "Memory you can audit: an append-only, provenance-first memory ledger for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Engram contributors" }]
keywords = ["agent", "memory", "llm", "provenance", "audit", "ledger"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
engram = "engram.cli:main"

[project.urls]
Homepage = "https://github.com/yourname/engram"

[tool.setuptools]
packages = ["engram"]
