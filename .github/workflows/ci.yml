name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: unit tests
        run: python -m unittest discover -s tests -v
      - name: decoy benchmark must have zero silent merges
        run: |
          python -m engram bench | tee bench.txt
          grep -Eq "silent merges +0( |$)" bench.txt
